<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Galería — Fotografía</title>
  <link rel="stylesheet" href="css/style.css?v=20260912-30">
</head>
<body>
  <header class="nav">
    <div class="top-bar">
      <a class="logo" href="index.html">GALERÍA</a>
      <button class="admin-button" type="button" id="admin-toggle">Administrar</button>
    </div>
    <div class="category-bar">
      <nav class="category-nav" aria-label="Categorías de fotos">
        <button class="category-button active" type="button" data-category="freestyle">Freestyle</button
        <button class="category-button" type="button" data-category="viajes">Viajes</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">FOTOGRAFÍA · 2026</p>
        <p class="eyebrow">Paloma Powell</p>
        <p class="eyebrow">Jesus Itel Montenegro</p>
        <h1>Algunos<br><em>instantes</em></h1>
        <p class="intro">
          Bienvenido a nuestra galería de fotografías.
        </p>
        <a class="button" href="#galeria">Entrar a la galería ↓</a>
      </div>

      <div class="hero-image">
        <div class="hero-carousel" aria-label="Carrusel automático de fotos">
          <div class="hero-track"></div>
        </div>
      </div>
    </section>

    <section class="gallery-section" id="galeria">
      <div class="section-heading">
        <p class="eyebrow">01 — COLECCIÓN</p>
        <div class="collection-tools" id="collection-tools"></div>
        <h2 class="category-title">Freestyle</h2>
      </div>

      <div class="carousel" aria-label="Carrusel de fotos">
        <button class="carousel-button previous" type="button" aria-label="Foto anterior">←</button>
        <div class="gallery">
          <div class="gallery-track">
            <article class="photo-card">
              <img class="photo-placeholder" src="fotos/Freestyle/DSC_1046.jpg" alt="Evento y retrato">
              <div class="caption"><span>01</span><span>Freestyle</span></div>
            </article>

            <article class="photo-card">
              <img class="photo-placeholder" src="fotos/Freestyle/DSC_0233.jpg" alt="Calle">
              <div class="caption"><span>02</span><span>Freestyle</span></div>
            </article>

            <article class="photo-card">
              <img class="photo-placeholder" src="fotos/Freestyle/DSC_0383.jpg" alt="Freestyle">
              <div class="caption"><span>03</span><span>Freestyle</span></div>
            </article>

            <article class="photo-card">
              <img class="photo-placeholder" src="fotos/Freestyle/DSC_0934.jpg" alt="Evento">
              <div class="caption"><span>04</span><span>Freestyle</span></div>
            </article>
          </div>
        </div>
        <button class="carousel-button next" type="button" aria-label="Foto siguiente">→</button>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" id="lightbox-close" aria-label="Cerrar foto">×</button>
    <button class="lightbox-arrow lightbox-previous" type="button" id="lightbox-previous" aria-label="Foto anterior">←</button>
    <figure class="lightbox-content">
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-arrow lightbox-next" type="button" id="lightbox-next" aria-label="Foto siguiente">→</button>
  </div>

  <aside class="admin-panel" id="admin-panel" aria-hidden="true">
    <button class="admin-close" type="button" id="admin-close" aria-label="Cerrar panel">×</button>
    <p class="eyebrow">PANEL PRIVADO</p>
    <h2>Gestionar fotos</h2>
    <form id="login-form" class="admin-form">
      <label>Correo<input id="login-email" type="email" autocomplete="email" required></label>
      <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Entrar</button>
    </form>
    <form id="upload-form" class="admin-form hidden">
      <label>Temática existente
        <select id="upload-category">
          <option value="freestyle">Freestyle</option>
          <option value="produ">Ciudad</option>
          <option value="viajes">Viajes</option>
        </select>
      </label>
      <label>Nueva temática (opcional)
        <input id="new-category-name" type="text" placeholder="Ej. Montañas" maxlength="40">
      </label>
      <label>Fotos<input id="upload-files" type="file" accept="image/*" multiple required></label>
      <div class="selected-files" id="selected-files"></div>
      <button class="button" type="submit">Subir fotos</button>
      <div class="photo-manager" id="photo-manager"></div>
      <button class="admin-logout" type="button" id="logout-button">Cerrar sesión</button>
    </form>
    <p class="admin-status" id="admin-status" role="status"></p>
  </aside>

  <footer>
    <span>© 2026 Tu Galería</span>
    <span>Fotografía</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=20260912-13"></script>
  <script src="js/app.js?v=20260912-15"></script>
</body>
</html>
